apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: o3-runtime-security
  namespace: o3-security
  labels:
    app.kubernetes.io/name: o3-runtime-security
    app.kubernetes.io/component: runtime-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: o3-runtime-security
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o3-runtime-security
        app.kubernetes.io/component: runtime-security
    spec:
      serviceAccountName: o3-runtime-security
      # eBPF runtime security needs the node's process + network view and the
      # kernel BPF/debug filesystems. This is why it is a SEPARATE privileged
      # DaemonSet, not part of the unprivileged k8s-mapper inventory agent.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists   # run on every node, including tainted/control-plane
      containers:
        - name: o3-runtime-security
          image: asia-south1-docker.pkg.dev/o3-public-artifacts/o3-public/kayo:latest
          imagePullPolicy: Always
          args:
            - "--procfs=/procRoot"
            - "--kayo-workers=8"
            # Score external egress destinations against O3 threat intel.
            - "--kayo-reputation-url=https://ipinfo.o3.security"
          # Backend config is passed via env, NOT args, so the API key never lands
          # in the pod command line (visible in `kubectl describe` / `ps`). The agent
          # reads these through viper's TETRAGON_ env binding. Findings appear under
          # Settings → Rules → Runtime Security → Findings, deduped per behaviour.
          env:
            # kayo-apikey  ← TETRAGON_KAYO_APIKEY (secret-backed, never in argv)
            - name: TETRAGON_KAYO_APIKEY
              valueFrom:
                secretKeyRef:
                  name: o3-security-credentials
                  key: api-key
            # kayo-server-url ← full GraphQL endpoint
            - name: TETRAGON_KAYO_SERVER_URL
              value: "https://api.o3.security/graphql"
            # kayo-project-name ← a display name for this cluster
            - name: TETRAGON_KAYO_PROJECT_NAME
              value: "my-cluster"  # Change to your cluster name
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: debug
              mountPath: /sys/kernel/debug
            - name: proc
              mountPath: /procRoot
              readOnly: true
      volumes:
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
        - name: debug
          hostPath:
            path: /sys/kernel/debug
        - name: proc
          hostPath:
            path: /proc
      terminationGracePeriodSeconds: 30
