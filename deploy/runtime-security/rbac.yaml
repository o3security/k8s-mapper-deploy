# ServiceAccount for the O3 runtime-security agent (KAYO).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: o3-runtime-security
  namespace: o3-security
  labels:
    app.kubernetes.io/name: o3-runtime-security
    app.kubernetes.io/component: runtime-security
---
# ClusterRole — READ-ONLY pod/namespace metadata so detections can be attributed
# to the right workload (namespace + image). The agent never mutates cluster state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: o3-runtime-security
  labels:
    app.kubernetes.io/name: o3-runtime-security
    app.kubernetes.io/component: runtime-security
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: o3-runtime-security
  labels:
    app.kubernetes.io/name: o3-runtime-security
    app.kubernetes.io/component: runtime-security
subjects:
  - kind: ServiceAccount
    name: o3-runtime-security
    namespace: o3-security
roleRef:
  kind: ClusterRole
  name: o3-runtime-security
  apiGroup: rbac.authorization.k8s.io
